name: macOS Build & Pre-Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check source patch and scripts
        run: |
          python3 tests/test_patch.py
          bash -n build.command
      - name: Build app (Apple Silicon)
        run: bash build.command
      - name: Create downloadable app ZIP
        run: ditto -c -k --sequesterRsrc --keepParent "Mac Display Control.app" "Mac-Display-Control-v0.0.1-beta-macOS-arm64.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Display-Control-macOS-arm64
          path: Mac-Display-Control-v0.0.1-beta-macOS-arm64.zip
      - name: Create GitHub pre-release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Mac-Display-Control-v0.0.1-beta-macOS-arm64.zip" \
            --title "Mac Display Control 0.0.1 Beta" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
